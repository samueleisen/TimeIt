<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>TimeIt</title>
  <meta name="description" content="Minimalist vertical countdown canvas for mobile.">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Vertical Blank Canvas Container -->
  <div class="canvas-container">
    <header class="canvas-header">
      <button id="sidebarToggleBtn" class="menu-btn" aria-label="Open Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="app-logo">TimeIt</span>
      <div class="header-spacer"></div>
    </header>

    <!-- Canvas Countdowns List -->
    <main class="countdown-list" id="countdownList">
      <!-- Empty state shown when no countdowns exist -->
      <div class="canvas-empty" id="canvasEmpty">
        <p class="empty-hint">Tap <strong>+</strong> to start a countdown</p>
      </div>
    </main>

    <!-- Speed Dial Wrapper -->
    <div class="fab-wrapper" id="fabWrapper">
      <!-- Backdrop when speed dial is open -->
      <div class="fab-backdrop hidden" id="fabBackdrop"></div>

      <!-- Vertical Speed Dial Options Menu -->
      <div class="speed-dial-menu hidden" id="speedDialMenu">
        <!-- Dynamically populated from app.js based on shortcuts -->
      </div>

      <!-- Main FAB Plus Toggle -->
      <button id="fabToggleBtn" class="fab-btn" aria-label="Add Countdown">
        <svg class="fab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Minimal Bottom Sheet / Modal -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop">
    <div class="sheet-card" id="sheetCard">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div>
          <h2 class="sheet-title" id="modalTitle">New Countdown</h2>
          <p class="sheet-subtitle" id="modalSubtitle"></p>
        </div>
        <button type="button" class="close-btn" id="closeSheetBtn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="addCountdownForm" autocomplete="off">
        <div class="form-group">
          <label for="eventTitleInput" class="form-label" id="titleInputLabel">Countdown Title</label>
          <input type="text" id="eventTitleInput" class="form-input" placeholder="e.g. Claude Opus, Team Standup, Oven"
            maxlength="50" required autofocus />
        </div>

        <!-- Custom Date & Time Picker (Toggled based on mode) -->
        <div class="form-group" id="dateTimeGroup">
          <label for="eventDateInput" class="form-label">Target Date & Time</label>
          <input type="datetime-local" id="eventDateInput" class="form-input" />
        </div>

        <!-- Gauge Color Picker -->
        <div class="form-group">
          <label class="form-label">Gauge Color</label>
          <div class="color-picker-row" id="colorPickerRow">
            <button type="button" class="color-dot active" data-color="#6366f1" style="--dot-color: #7800f0;"
              title="Indigo"></button>
            <button type="button" class="color-dot" data-color="#10b981" style="--dot-color: #00e69a;"
              title="Emerald"></button>
            <button type="button" class="color-dot" data-color="#06b6d4" style="--dot-color: #00bfe0;"
              title="Cyan"></button>
            <button type="button" class="color-dot" data-color="#f59e0b" style="--dot-color: #ffa200;"
              title="Amber"></button>
            <button type="button" class="color-dot" data-color="#f43f5e" style="--dot-color: #ec0229;"
              title="Rose"></button>
            <button type="button" class="color-dot" data-color="#94a3b8" style="--dot-color: #003d92;"
              title="Silver"></button>
            <label class="color-custom-btn" id="customColorBtn" title="Custom Color">
              <input type="color" id="customColorInput" value="#6366f1">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </label>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="startCountdownBtn">
          Start Countdown
        </button>
      </form>
    </div>
  </div>

  <!-- Hidden Left Sidebar Drawer -->
  <div class="sidebar-backdrop hidden" id="sidebarBackdrop">
    <aside class="sidebar-drawer" id="sidebarDrawer">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>TimeIt</span>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- Edit Mode Switch Row -->
        <div class="sidebar-toggle-row">
          <div class="toggle-label-wrap">
            <span class="sidebar-toggle-title">Edit Mode</span>
          </div>
          <label class="switch" for="editModeToggle" aria-label="Toggle Edit Mode">
            <input type="checkbox" id="editModeToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="sidebar-accordion">
          <button type="button" class="accordion-header-btn" id="toggleShortcutsAccordionBtn" aria-expanded="false">
            <div class="accordion-title-wrap">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>Duration Shortcuts</span>
            </div>
            <svg class="accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Collapsible Body (Hidden by default) -->
          <div class="accordion-body hidden" id="shortcutsAccordionBody">
            <div class="sidebar-shortcuts-list" id="sidebarShortcutsList">
              <!-- Dynamically populated list with delete buttons -->
            </div>

            <div class="sidebar-add-box">
              <span class="sidebar-subhead">Add Preset</span>
              <div class="sidebar-add-row">
                <input type="number" id="sidebarShortcutAmount" class="sidebar-input-num" placeholder="5" min="1"
                  max="999" />
                <select id="sidebarShortcutUnit" class="sidebar-select-unit">
                  <option value="hours">Hours</option>
                  <option value="days">Days</option>
                  <option value="minutes">Mins</option>
                </select>
                <button type="button" id="sidebarAddShortcutBtn" class="sidebar-btn-add">+ Add</button>
              </div>
            </div>

            <button type="button" id="restoreDefaultsBtn" class="sidebar-btn-restore">Restore Defaults</button>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <span class="sidebar-version">© SamuelEisen</span>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>

</html>
